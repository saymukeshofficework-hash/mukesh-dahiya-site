<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages serves this file for any unresolved path on this
      // site. This is a client-routed single-page app, so a direct load
      // or refresh on a deep route (e.g. /courses) lands here rather
      // than in the app. Redirect to index.html with the real path
      // encoded in a query string; main.tsx decodes it and restores the
      // URL before the router reads it.
      var target =
        '/index.html?msd_redirect=' +
        encodeURIComponent(window.location.pathname + window.location.search + window.location.hash)
      window.location.replace(target)
    </script>
  </head>
  <body>
    <p>Redirecting… <a href="/">Go to the homepage</a>.</p>
  </body>
</html>
